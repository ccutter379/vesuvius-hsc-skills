<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cities of Vesuvius Jeopardy — Version 2</title>
<style>
  /* ---------- Colours: dark background, white text, Pompeian red accent ---------- */
  :root {
    --bg: #14100F;
    --panel: #221A18;
    --tile: #2E2320;
    --tile-hover: #3D2D28;
    --tile-done: #1B1614;
    --text: #FFFFFF;
    --muted: #B8A9A2;
    --accent: #B0322B;      /* Pompeian red */
    --accent-light: #D9534A;
    --gold: #E8B44C;
    --border: #4A3733;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    min-height: 100vh;
    padding-inline: 16px;
    padding-block: 12px;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ---------- Header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    border-bottom: 3px solid var(--accent); padding-bottom: 8px; margin-bottom: 10px;
  }
  header h1 { margin: 0; font-size: clamp(1.4rem, 2.6vw, 2.2rem); letter-spacing: 0.02em; }
  header h1 small { display: block; font-size: 0.5em; color: var(--muted); font-weight: normal; letter-spacing: 0.08em; text-transform: uppercase; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--panel); color: var(--text); border: 2px solid var(--border);
    padding: 8px 14px; border-radius: 6px; font-size: 0.95rem;
  }
  .btn:hover { border-color: var(--accent-light); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent-light); }
  .btn.gold { background: var(--gold); color: #1a1208; border-color: var(--gold); font-weight: bold; }

  /* ---------- Board ---------- */
  #board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: minmax(0, 1fr);
    gap: 8px;
    min-height: 0;
  }
  .cat {
    background: var(--accent); color: #fff; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: bold; font-size: clamp(0.8rem, 1.5vw, 1.25rem); line-height: 1.2;
    padding: 6px 8px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .tile {
    background: var(--tile); color: var(--gold); border: 2px solid var(--border); border-radius: 8px;
    font-size: clamp(1.4rem, 4vw, 3.2rem); font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
  }
  .tile:hover { background: var(--tile-hover); transform: scale(1.02); }
  .tile.done { background: var(--tile-done); color: #4a3d39; border-color: #2a201d; cursor: default; transform: none; }

  /* ---------- Scoreboard ---------- */
  #scores {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px;
    margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--border);
  }
  .team {
    background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 8px 10px;
    display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 4px 8px; align-items: center;
  }
  .team input.name {
    background: transparent; border: none; border-bottom: 1px dashed var(--border); color: var(--text);
    font: inherit; font-weight: bold; width: 100%; padding: 2px 0;
  }
  .team input.name:focus { outline: none; border-bottom-color: var(--gold); }
  .team .score { font-size: 1.6rem; font-weight: bold; color: var(--gold); text-align: right; grid-row: span 2; }
  .team .adj { display: flex; gap: 6px; }
  .team .adj button {
    background: var(--tile); color: var(--text); border: 1px solid var(--border); border-radius: 5px;
    width: 40px; height: 32px; font-size: 1.1rem; font-weight: bold;
  }
  .team .adj button.plus:hover { background: #2f6b3a; }
  .team .adj button.minus:hover { background: #7a2a2a; }

  /* ---------- Clue overlay ---------- */
  #overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; padding: 16px 4vw; overflow-y: auto;
  }
  #overlay[hidden] { display: none; }
  .ov-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ov-cat { color: var(--accent-light); font-weight: bold; text-transform: uppercase; letter-spacing: 0.08em; font-size: clamp(1rem, 2vw, 1.4rem); }
  .ov-value { color: var(--gold); font-weight: bold; font-size: clamp(1.2rem, 2.5vw, 1.8rem); }
  .ov-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 20px; }
  .ov-clue { line-height: 1.3; max-width: 1400px; }
  .ov-clue.short  { font-size: clamp(1.6rem, 3.8vw, 3.6rem); }
  .ov-clue.medium { font-size: clamp(1.4rem, 3vw, 2.8rem); }
  .ov-clue.long   { font-size: clamp(1.2rem, 2.4vw, 2.2rem); }
  .ov-answer { line-height: 1.3; max-width: 1300px; color: var(--gold); border-top: 2px solid var(--accent); padding-top: 16px; }
  .ov-answer.short  { font-size: clamp(1.3rem, 3vw, 2.8rem); }
  .ov-answer.medium { font-size: clamp(1.1rem, 2.2vw, 2rem); }
  .ov-answer.long   { font-size: clamp(1rem, 1.7vw, 1.5rem); text-align: left; }
  .ov-answer[hidden] { display: none; }
  .ov-bottom { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding-top: 12px; }
  .ov-bottom .btn { font-size: 1.1rem; padding: 12px 22px; }
  .ov-scores { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .ov-scores .team { min-width: 170px; }
  .ov-hint { color: var(--muted); font-size: 0.9rem; text-align: center; margin-top: 6px; }

  /* Daily Double splash */
  .dd-splash {
    font-size: clamp(2.5rem, 8vw, 7rem); font-weight: 900; color: var(--gold); letter-spacing: 0.05em;
    text-transform: uppercase; text-shadow: 0 0 30px rgba(232,180,76,0.5);
    animation: pulse 1s ease-in-out infinite alternate;
  }
  .dd-badge {
    display: inline-block; background: var(--gold); color: #1a1208; font-weight: bold; padding: 4px 12px;
    border-radius: 999px; font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

  /* Final Jeopardy wager rows */
  .final-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; max-width: 1200px; }
  .final-team { background: var(--panel); border: 2px solid var(--border); border-radius: 8px; padding: 10px; text-align: left; }
  .final-team .nm { font-weight: bold; }
  .final-team .sc { color: var(--gold); font-weight: bold; float: right; }
  .final-team label { display: block; color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .final-team input.wager { width: 100%; font: inherit; font-size: 1.1rem; padding: 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--tile); color: var(--text); }
  .final-team .fbtns { display: flex; gap: 6px; margin-top: 8px; }
  .final-team .fbtns button { flex: 1; padding: 8px; border-radius: 5px; border: none; font-weight: bold; }
  .final-team .fbtns .ok { background: #2f6b3a; color: #fff; }
  .final-team .fbtns .no { background: #7a2a2a; color: #fff; }
  .final-team .fbtns button:disabled { opacity: 0.4; cursor: default; }

  @media (max-width: 700px) {
    #board { gap: 4px; }
    .cat { font-size: 0.6rem; padding: 4px; }
    .tile { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<header>
  <h1 id="gameTitle"></h1>
  <div class="controls">
    <button class="btn" id="teamsBtn" title="Change the number of teams">Teams: <span id="teamCount">3</span></button>
    <button class="btn gold" id="finalBtn" title="Open the Final Jeopardy clue">Final Jeopardy</button>
    <button class="btn" id="resetBtn" title="Clear the board and all scores">Reset game</button>
  </div>
</header>

<main id="board" aria-label="Game board"></main>

<section id="scores" aria-label="Scoreboard"></section>

<!-- Clue overlay -->
<div id="overlay" hidden>
  <div class="ov-top">
    <div class="ov-cat" id="ovCat"></div>
    <div><span class="dd-badge" id="ovDD" hidden>Daily Double</span> <span class="ov-value" id="ovValue"></span></div>
  </div>
  <div class="ov-body" id="ovBody">
    <div class="dd-splash" id="ddSplash" hidden>Daily Double!</div>
    <div class="ov-clue" id="ovClue"></div>
    <div class="ov-answer" id="ovAnswer" hidden></div>
    <div class="final-teams" id="finalTeams" hidden></div>
  </div>
  <div class="ov-bottom" id="ovButtons"></div>
  <div class="ov-scores" id="ovScores"></div>
  <div class="ov-hint" id="ovHint"></div>
</div>

<script>

   Each category has five clues worth 100–500. To change a clue, edit the
   text between the quotation marks. Keep the commas and brackets as they
   are. "dailyDouble" says which category (0 = first, 5 = last) and which
   value carries the Daily Double.
   ===================================================================== */
const GAME = {
  "title": "Cities of Vesuvius Jeopardy — Version 2",
  "subtitle": "HSC Ancient History — Core Study: Pompeii and Herculaneum",
  "version": "v2",
  "dailyDouble": {
    "category": 4,
    "value": 400

    {

        {

          "clue": "This mountain on the Bay of Naples erupted in AD 79 and buried Pompeii and Herculaneum. Nobody at the time realised it was a volcano.",

          "accept": "\"Pliny\" on its own is fine. Do NOT accept \"Pliny the Elder\" — the uncle who sailed towards the eruption and died at Stabiae.",
          "note": "",
          "source": "Study Guide, Part A (Pliny the Younger's letters); Source Cards S01"
        },
        {
          "value": 300,
          "clue": "In the first phase of the eruption this light volcanic stone rained down on Pompeii at about 15 cm an hour, piling up nearly 3 metres deep and collapsing roofs.",
          "answer": "Pumice (lapilli)",
          "accept": "\"Pumice\" or \"lapilli\". Accept \"pumice and ash\". Do not accept \"lava\" — no lava reached the cities.",
          "note": "",
          "source": "Study Guide, Part A (Plinian phase); Source Cards S24"
        },
        {
          "value": 400,
          "clue": "In the second phase, these superheated clouds of gas and ash raced down the mountain at hundreds of kilometres an hour, striking Herculaneum first and killing everyone still there instantly.",
          "answer": "Pyroclastic surges (and flows)",
          "accept": "\"Pyroclastic surges\", \"pyroclastic flows\" or \"pyroclastic surges and flows\". \"Pyroclastic\" on its own is enough for a 400.",
          "note": "Temperature estimates vary between studies (c. 400–500°C at Herculaneum in the Study Guide; Mastrolorenzo's 500°C figure is a reading of the bones, not a measurement).",
          "source": "Study Guide, Part A (Pelean phase); Source Study Guide, Section 1"
        },
        {
          "value": 500,
          "clue": "Which archaeologist? Director from 1860, he divided Pompeii into numbered regions and blocks, opened the site to paying visitors, and in 1863 first poured plaster into the cavities left by the victims' bodies.",
          "answer": "Giuseppe Fiorelli",
          "accept": "\"Fiorelli\" is enough.",
          "note": "",
          "source": "Study Guide, Part A (Early discoveries); Source Study Guide, Section 1"
        }
      ]
    },
    {
      "name": "Everyday Life",
      "clues": [
        {
          "value": 100,
          "clue": "Pompeii's most famous export: a strong-smelling fermented fish sauce. Aulus Umbricius Scaurus advertised his brand in the floor mosaics of his own house.",

          "value": 200,
          "clue": "Most Pompeians did not cook at home. They bought hot food and wine over the counter at these bars, which had large storage jars sunk into the counter top.",

          "accept": "Either singular or plural. \"Snack bar\" or \"fast-food bar\" earns half; the Latin term earns full points.",
          "note": "",

        },
        {
          "value": 300,
          "clue": "The main hall of a Roman house, just inside the front door, with an opening in the roof and a rain-catching pool (the impluvium) in the floor below it.",

          "accept": "",
          "note": "",

        },
        {
          "value": 500,
          "clue": "Which researcher? From 1986 this University of Sydney archaeologist studied the jumbled bones in Pompeii's bath-house stores and found the victims were a normal cross-section of the population — not just the old, sick, women and children.",
          "answer": "Estelle Lazer",

    },
    {
      "name": "Social and Political Structure",

        {
          "value": 100,
          "clue": "About 2,800 of these painted election notices survive on Pompeii's walls, urging people to vote for candidates as \"a good man, worthy of public office\".",

        }

    },
    {
      "name": "Sources and Evidence",
      "clues": [
        {
          "value": 100,

          "clue": "Explain the significance: the Garden of the Fugitives displays plaster casts of a fleeing group behind glass, exactly where they died. Give ONE argument FOR displaying human remains this way and ONE argument AGAINST.",
          "answer": "FOR: showing them where they died keeps their context and arguably dignifies them; it creates empathy and educates millions; it builds the public support that funds conservation. AGAINST: the dead cannot consent; the casts contain real bones, so this is displaying human remains as a spectacle (\"dark tourism\"); it profits from the dead; and there is no descendant community to speak for them, so custodians must act as their advocates.",
          "accept": "Full points for one clear argument each way. Praise a team that mentions the ICOM Code of Ethics or that the casts contain real bones.",
          "note": "The often-quoted figure of 13 casts in the Garden of the Fugitives does not appear in your three set texts (Teacher Guide, S08) — so the clue avoids a number.",
          "source": "Study Guide, Part C (The dead on display; evidence table); Source Study Guide, Section 3 (Ethical issues)"
        }
      ]
    }
  ],
  "final": {
    "category": "Pompeii versus Herculaneum",
    "clue": "The eruption \"did not simply destroy two towns — it created two different archives.\" Explain ONE way the two cities were buried differently, and give ONE type of evidence each city preserved that the other lost.",
    "answer": "BURIAL: Pompeii, downwind, was buried under about 4–6 metres of loose pumice and ash over roughly 18 hours (most people fled; roofs collapsed; the city was shallow enough for later salvagers to tunnel in). Herculaneum, upwind, got only a dusting of ash, then was hit by the first pyroclastic surges at about 1 am and sealed under some 20–23 metres of hot material that hardened to rock. EVIDENCE: Pompeii preserved body cavities (so plaster casts), streetscapes, election notices and frescoes, but its organic material rotted away. Herculaneum's hot, airless burial carbonised wood, doors, furniture, food, a boat and about 1,800 papyrus scrolls — and it kept real skeletons (the c. 300 in the boat chambers) — but there were no cavities, so no casts.",
    "accept": "Score like a mini extended response: 1 = one correct difference; 2 = burial difference plus one evidence type; 3 = burial difference plus one evidence type for EACH city; 4 = all of that plus a reason (depth, heat, wind direction or timing) explaining why.",
    "note": "Bradley notes recent research finds the two fates more similar than once thought — both towns were ultimately destroyed by surges — so present the contrast as one of degree and sequence, not of kind.",
    "source": "Study Guide (Pompeii vs Herculaneum — different burials, different evidence); Source Study Guide, Section 1 (comparison table)"
  }
};

/* =====================================================================
   GAME LOGIC — you should not need to edit below this line
   ===================================================================== */
const STORAGE_KEY = 'vesuvius-jeopardy-state-' + (GAME.version || 'v1');
const MAX_TEAMS = 5;

let state = {
  teamCount: 3,
  teams: ['Team 1', 'Team 2', 'Team 3', 'Team 4', 'Team 5'],
  scores: [0, 0, 0, 0, 0],
  done: {},          // "cat-value": true when a tile has been played
  finalPlayed: false
};

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const s = JSON.parse(raw); if (s && s.teams && s.scores) state = Object.assign(state, s); }
  } catch (e) {}
}

const $ = (id) => document.getElementById(id);
function sizeClass(base, text) {
  const n = (text || '').length;
  return base + ' ' + (n < 130 ? 'short' : n < 260 ? 'medium' : 'long');
}
const board = $('board');
const scoresEl = $('scores');
const overlay = $('overlay');

/* ---------- Board ---------- */
function renderBoard() {
  board.innerHTML = '';
  GAME.categories.forEach((cat) => {
    const h = document.createElement('div');
    h.className = 'cat';
    h.textContent = cat.name;
    board.appendChild(h);
  });
  const rows = 5;
  for (let r = 0; r < rows; r++) {
    GAME.categories.forEach((cat, ci) => {
      const clue = cat.clues[r];
      const key = ci + '-' + clue.value;
      const t = document.createElement('button');
      t.className = 'tile' + (state.done[key] ? ' done' : '');
      t.textContent = clue.value;
      t.setAttribute('aria-label', cat.name + ' for ' + clue.value);
      t.disabled = !!state.done[key];
      t.addEventListener('click', () => openClue(ci, r));
      board.appendChild(t);
    });
  }
  const allDone = GAME.categories.every((cat, ci) => cat.clues.every(c => state.done[ci + '-' + c.value]));
  $('finalBtn').classList.toggle('primary', allDone && !state.finalPlayed);
}

/* ---------- Scoreboard ---------- */
function teamCard(i, delta) {
  const card = document.createElement('div');
  card.className = 'team';
  const name = document.createElement('input');
  name.className = 'name'; name.value = state.teams[i]; name.title = 'Click to rename this team';
  name.addEventListener('change', () => { state.teams[i] = name.value || ('Team ' + (i + 1)); save(); renderScores(); });
  const score = document.createElement('div');
  score.className = 'score'; score.textContent = state.scores[i];
  const adj = document.createElement('div');
  adj.className = 'adj';
  const minus = document.createElement('button');
  minus.className = 'minus'; minus.textContent = '−'; minus.title = 'Subtract ' + delta;
  minus.addEventListener('click', () => adjust(i, -delta));
  const plus = document.createElement('button');
  plus.className = 'plus'; plus.textContent = '+'; plus.title = 'Add ' + delta;
  plus.addEventListener('click', () => adjust(i, delta));
  adj.append(minus, plus);
  card.append(name, score, adj);
  return card;
}
function renderScores() {
  scoresEl.innerHTML = '';
  for (let i = 0; i < state.teamCount; i++) scoresEl.appendChild(teamCard(i, 100));
  $('teamCount').textContent = state.teamCount;
  if (!overlay.hidden && current) renderOverlayScores();
}
function adjust(i, delta) {
  state.scores[i] += delta;
  save();
  renderScores();
}

/* ---------- Clue overlay ---------- */
let current = null;   // { ci, r, clue, isDD, stage }  stage: 'dd' | 'clue' | 'answer' | 'final'

function isDailyDouble(ci, clue) {
  return GAME.dailyDouble && GAME.dailyDouble.category === ci && GAME.dailyDouble.value === clue.value;
}

function openClue(ci, r) {
  const cat = GAME.categories[ci];
  const clue = cat.clues[r];
  const dd = isDailyDouble(ci, clue);
  current = { ci, r, clue, isDD: dd, stage: dd ? 'dd' : 'clue', points: dd ? clue.value * 2 : clue.value };
  $('ovCat').textContent = cat.name;
  $('ovValue').textContent = current.points + ' points';
  $('ovDD').hidden = !dd;
  $('finalTeams').hidden = true;
  $('ovAnswer').hidden = true;
  $('ovAnswer').textContent = clue.answer;
  $('ovAnswer').className = sizeClass('ov-answer', clue.answer);
  $('ovClue').textContent = clue.clue;
  $('ovClue').className = sizeClass('ov-clue', clue.clue);
  if (dd) {
    $('ddSplash').hidden = false;
    $('ovClue').hidden = true;
    $('ovHint').textContent = 'Daily Double: this clue is worth double — ' + current.points + ' points. Click "Show clue" when the team is ready.';
  } else {
    $('ddSplash').hidden = true;
    $('ovClue').hidden = false;
    $('ovHint').textContent = 'Press Space or Enter to reveal the answer, then again to return to the board. Esc returns without marking the tile.';
  }
  renderOverlayButtons();
  renderOverlayScores();
  overlay.hidden = false;
}

function renderOverlayButtons() {
  const b = $('ovButtons');
  b.innerHTML = '';
  const mk = (label, cls, fn) => { const x = document.createElement('button'); x.className = 'btn ' + cls; x.textContent = label; x.addEventListener('click', fn); b.appendChild(x); return x; };
  if (current.stage === 'dd') {
    mk('Show clue', 'primary', advance);
  } else if (current.stage === 'clue') {
    mk('Reveal answer', 'primary', advance);
    mk('Back to board (keep tile)', '', () => closeOverlay(false));
  } else if (current.stage === 'answer') {
    mk('Back to board', 'primary', () => closeOverlay(true));
  } else if (current.stage === 'final') {
    mk('Reveal model answer', 'primary', () => { $('ovAnswer').hidden = false; });
    mk('Close', '', () => { state.finalPlayed = true; save(); closeOverlay(false); });
  }
}

function renderOverlayScores() {
  const s = $('ovScores');
  s.innerHTML = '';
  if (!current || current.stage === 'final') return;
  for (let i = 0; i < state.teamCount; i++) s.appendChild(teamCard(i, current.points));
}

function advance() {
  if (!current) return;
  if (current.stage === 'dd') {
    current.stage = 'clue';
    $('ddSplash').hidden = true;
    $('ovClue').hidden = false;
    $('ovHint').textContent = 'Press Space or Enter to reveal the answer, then again to return to the board.';
  } else if (current.stage === 'clue') {
    current.stage = 'answer';
    $('ovAnswer').hidden = false;
  } else if (current.stage === 'answer') {
    closeOverlay(true);
    return;
  } else if (current.stage === 'final') {
    $('ovAnswer').hidden = false;
    return;
  }
  renderOverlayButtons();
}

function closeOverlay(markDone) {
  if (current && markDone && current.stage !== 'final') {
    state.done[current.ci + '-' + current.clue.value] = true;
    save();
  }
  current = null;
  overlay.hidden = true;
  renderBoard();
  renderScores();
}

/* ---------- Final Jeopardy ---------- */
function openFinal() {
  const f = GAME.final;
  current = { stage: 'final', points: 0 };
  $('ovCat').textContent = 'Final Jeopardy — ' + f.category;
  $('ovValue').textContent = 'Wager';
  $('ovDD').hidden = true;
  $('ddSplash').hidden = true;
  $('ovClue').hidden = false;
  $('ovClue').textContent = f.clue;
  $('ovClue').className = sizeClass('ov-clue', f.clue);
  $('ovAnswer').textContent = f.answer;
  $('ovAnswer').className = 'ov-answer long';
  $('ovAnswer').hidden = true;
  $('ovHint').textContent = 'Each team writes a wager (up to their current score), then answers. Mark each team Correct or Wrong to apply the wager.';
  const ft = $('finalTeams');
  ft.innerHTML = '';
  ft.hidden = false;
  for (let i = 0; i < state.teamCount; i++) {
    const card = document.createElement('div');
    card.className = 'final-team';
    card.innerHTML = '<span class="sc" data-sc>' + state.scores[i] + '</span><div class="nm">' + escapeHtml(state.teams[i]) + '</div>' +
      '<label>Wager</label><input class="wager" type="number" min="0" value="0">' +
      '<div class="fbtns"><button class="ok">Correct</button><button class="no">Wrong</button></div>';
    const wager = card.querySelector('.wager');
    const ok = card.querySelector('.ok');
    const no = card.querySelector('.no');
    const applyWager = (sign) => {
      const w = Math.max(0, parseInt(wager.value, 10) || 0);
      state.scores[i] += sign * w;
      save();
      card.querySelector('[data-sc]').textContent = state.scores[i];
      ok.disabled = no.disabled = true;
      wager.disabled = true;
      renderScores();
    };
    ok.addEventListener('click', () => applyWager(1));
    no.addEventListener('click', () => applyWager(-1));
    ft.appendChild(card);
  }
  renderOverlayButtons();
  $('ovScores').innerHTML = '';
  overlay.hidden = false;
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- Header buttons & keyboard ---------- */
$('teamsBtn').addEventListener('click', () => {
  state.teamCount = state.teamCount >= MAX_TEAMS ? 2 : state.teamCount + 1;
  save(); renderScores();
});
$('finalBtn').addEventListener('click', openFinal);
$('resetBtn').addEventListener('click', () => {
  if (!confirm('Clear the board and reset all scores to zero?')) return;
  state.done = {}; state.scores = [0, 0, 0, 0, 0]; state.finalPlayed = false;
  save(); renderBoard(); renderScores();
});
document.addEventListener('keydown', (e) => {
  if (overlay.hidden) return;
  if (e.target && (e.target.tagName === 'INPUT')) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); advance(); }
  if (e.key === 'Escape') { e.preventDefault(); if (current && current.stage === 'final') { state.finalPlayed = true; save(); } closeOverlay(false); }
});
// Clicking the clue text itself also advances (handy with a wireless mouse)
$('ovBody').addEventListener('click', (e) => {
  if (!current || current.stage === 'final') return;
  if (e.target.closest('.team') || e.target.closest('button') || e.target.closest('input')) return;
  advance();
});

/* ---------- Start ---------- */
$('gameTitle').innerHTML = escapeHtml(GAME.title) + '<small>' + escapeHtml(GAME.subtitle) + '</small>';
load();
renderBoard();
renderScores();
</script>
</body>
</html>
